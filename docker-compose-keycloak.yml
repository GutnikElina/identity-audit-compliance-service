# Usage:
#   1. Make sure infra is up and Keycloak is healthy
#   2. Copy .env.example to .env here and set KC_IDENTITY_SERVICE_CLIENT_SECRET
#   3. Run:  docker compose -f docker-compose-keycloak.yml up --exit-code-from keycloak-config
#   4. Clean up the finished container:  docker compose -f docker-compose-keycloak.yml down

name: identity-audit-compliance-service-keycloak-bootstrap

networks:
  default:
    name: infra-net
    external: true

services:
  keycloak-config:
    image: ${KC_CONFIG_CLI_IMAGE:-adorsys/keycloak-config-cli:latest}
    restart:
      on-failure:5
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      IMPORT_FILES_LOCATIONS: /config/realm-export.json
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
    volumes:
      - ./src/main/resources/keycloak:/config:ro