name: identity-audit-compliance-service-infra

networks:
  default:
    name: infra-net
    external: true

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: identity-audit-clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-audit_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-audit_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-audit_password}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: identity-audit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: identity-audit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: identity-audit-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://identity-audit-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: identity-audit-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: identity-audit-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAPSERVERS: identity-audit-kafka:29092